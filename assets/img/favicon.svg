<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JM">
  <!-- Monograma JM: amarillo sobre negro, la paleta de la web.
       El texto usa la pila genérica del sistema a propósito: un favicon SVG
       lo dibuja el navegador y no puede depender de una fuente descargada. -->
  <rect width="64" height="64" rx="12" fill="#0E0E0E"/>
  <text x="32" y="33" fill="#F2C200"
        font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1"
        text-anchor="middle" dominant-baseline="central">JM</text>
</svg>
